#VRML_SIM R2025a utf8
# x forward, y left, z up; two powered wheels and two passive ball supports.
PROTO RescueBot [
  field SFVec3f translation 0 0 0
  field SFRotation rotation 0 0 1 0
  field SFString controller "rescue_controller"
] {
  Robot {
    translation IS translation
    rotation IS rotation
    name "RescueBot"
    controller IS controller
    supervisor FALSE
    children [
      Pose {
        translation 0 0 0.16
        children [
          Shape {
            appearance PBRAppearance { baseColor 0.23 0.25 0.27 roughness 0.8 metalness 0 }
            geometry Cylinder { radius 0.18 height 0.16 }
          }
        ]
      }
      HingeJoint {
        jointParameters HingeJointParameters { axis 0 1 0 anchor 0 0.16 0.075 }
        device [
          RotationalMotor { name "left wheel motor" maxVelocity 12 maxTorque 4 }
          PositionSensor { name "left wheel sensor" }
        ]
        endPoint Solid {
          translation 0 0.16 0.075
          rotation 1 0 0 1.57079632679
          contactMaterial "wheel"
          children [ Shape {
            appearance PBRAppearance { baseColor 0.05 0.05 0.05 roughness 1 metalness 0 }
            geometry Cylinder { radius 0.075 height 0.035 subdivision 24 }
          } ]
          name "left wheel"
          boundingObject Cylinder { radius 0.075 height 0.035 }
          physics Physics { density -1 mass 0.15 }
        }
      }
      HingeJoint {
        jointParameters HingeJointParameters { axis 0 1 0 anchor 0 -0.16 0.075 }
        device [
          RotationalMotor { name "right wheel motor" maxVelocity 12 maxTorque 4 }
          PositionSensor { name "right wheel sensor" }
        ]
        endPoint Solid {
          translation 0 -0.16 0.075
          rotation 1 0 0 1.57079632679
          contactMaterial "wheel"
          children [ Shape {
            appearance PBRAppearance { baseColor 0.05 0.05 0.05 roughness 1 metalness 0 }
            geometry Cylinder { radius 0.075 height 0.035 subdivision 24 }
          } ]
          name "right wheel"
          boundingObject Cylinder { radius 0.075 height 0.035 }
          physics Physics { density -1 mass 0.15 }
        }
      }
      Pose {
        translation 0.13 0 0.022
        children [ Shape { appearance PBRAppearance { baseColor 0.5 0.5 0.5 }
                           geometry Sphere { radius 0.022 } } ]
      }
      Pose {
        translation -0.13 0 0.022
        children [ Shape { appearance PBRAppearance { baseColor 0.5 0.5 0.5 }
                           geometry Sphere { radius 0.022 } } ]
      }
      Lidar {
        translation 0 0 0.36
        name "lidar"
        horizontalResolution 360
        fieldOfView 6.28318530718
        verticalFieldOfView 0.03
        numberOfLayers 1
        minRange 0.06
        maxRange 5
        near 0.03
        noise 0.001
      }
      Camera {
        translation 0.14 0 0.36
        name "camera"
        width 320 height 240
        fieldOfView 1.4
        near 0.03 far 5
        recognition NULL
      }
      Gyro { name "gyro" }
      Accelerometer { name "accelerometer" }
      Emitter { name "mission events" channel 17 }
    ]
    contactMaterial "caster"
    boundingObject Group {
      children [
        Pose { translation 0 0 0.16 children [ Cylinder { radius 0.18 height 0.16 } ] }
        Pose { translation 0.13 0 0.022 children [ Sphere { radius 0.022 } ] }
        Pose { translation -0.13 0 0.022 children [ Sphere { radius 0.022 } ] }
      ]
    }
    physics Physics { density -1 mass 3 centerOfMass [ 0 0 0.11 ] }
  }
}
